name: Update CLAUDE.md

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'  # monthly on the 1st

jobs:
  update-claude-md:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze repo and update CLAUDE.md
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Analyze this repository and update the CLAUDE.md file to reflect the current state of the codebase.

            Process:
            1. Review the existing CLAUDE.md
            2. Analyze the current project structure, dependencies, and key commands
            3. Identify any sections that are outdated or missing
            4. Rewrite only the sections that need updating

            Writing rules:
            - Describe the structure of the repo, not the functionality of individual files
            - Agents will read the code themselves. Your job is to point them to the right places
            - Keep it under 300 words
            - Only include facts that stay stable across many commits
            - Commands must be verified and copy-pasteable

            Key files to check:
            - frontend/package.json (deps and scripts)
            - backend/pyproject.toml (deps and Python version)
            - backend/app/ (subdirectory layout)
            - frontend/src/ (subdirectory layout)
            - compose.yml (infra services)

      - name: Create branch and open PR if CLAUDE.md changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet CLAUDE.md; then
            echo "CLAUDE.md unchanged — no PR needed."
            exit 0
          fi

          BRANCH="auto/update-claude-md-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add CLAUDE.md
          git commit -m "docs: update CLAUDE.md to reflect current codebase"
          git push origin "$BRANCH"

          gh pr create \
            --title "docs: update CLAUDE.md" \
            --base main \
            --head "$BRANCH" \
            --body "$(cat <<'EOF'
          ## Summary

          - Auto-generated by the `Update CLAUDE.md` workflow
          - Analyzed project structure, dependencies, and commands
          - Updated only sections that were outdated or missing

          ## Review checklist

          - [ ] Commands are accurate and copy-pasteable
          - [ ] Structure section matches current directory layout
          - [ ] Tech stack versions match package.json / pyproject.toml
          - [ ] Under 300 words
          EOF
          )"
