# fly.toml app configuration file generated for clinicians-semantic-search on 2026-05-18T19:34:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clinicians-semantic-search'
primary_region = 'sjc'

[build]

[deploy]
  wait_timeout = '10m0s'
  release_command = '/app/.venv/bin/python -c "from app.db.init_db import init_db; init_db()"'
  release_command_timeout = '10m0s'

[env]
  ENVIRONMENT = 'production'
  PRELOAD_SEARCH_MODEL = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '20s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
