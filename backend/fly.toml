# fly.toml app configuration file generated for clinicians-semantic-search on 2026-03-31T07:13:39Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'clinicians-semantic-search'
primary_region = 'iad'

[build]

[env]
  ENVIRONMENT = 'production'

[deploy]
  release_command = '/app/.venv/bin/python -c "from app.db.init_db import init_db; init_db()"'
  release_command_timeout = '10m'
  wait_timeout = '10m'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '30s'
    interval = '15s'
    method = 'GET'
    timeout = '10s'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
